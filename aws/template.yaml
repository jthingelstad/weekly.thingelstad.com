AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Weekly Thing Archive Librarian API

Parameters:
  AllowedOrigin:
    Type: String
    Default: https://weekly.thingelstad.com
  CorpusBucket:
    Type: String
    Description: S3 bucket containing the librarian corpus JSON.
  CorpusKey:
    Type: String
    Default: librarian/corpus.json
  GraphKey:
    Type: String
    Default: librarian/graph.json
  ButtondownApiKey:
    Type: String
    NoEcho: true
  TinylyticsApiKey:
    Type: String
    NoEcho: true
  TinylyticsSiteId:
    Type: String
    Default: "3063"
  SessionSecret:
    Type: String
    NoEcho: true

Globals:
  Function:
    Runtime: python3.12
    Timeout: 35
    MemorySize: 1024
    Architectures:
      - arm64
    Environment:
      Variables:
        ALLOWED_ORIGIN: !Ref AllowedOrigin
        TABLE_NAME: !Ref LibrarianTable
        CORPUS_BUCKET: !Ref CorpusBucket
        CORPUS_KEY: !Ref CorpusKey
        GRAPH_KEY: !Ref GraphKey
        BUTTONDOWN_API_KEY: !Ref ButtondownApiKey
        TINYLYTICS_API_KEY: !Ref TinylyticsApiKey
        TINYLYTICS_SITE_ID: !Ref TinylyticsSiteId
        TINYLYTICS_ENABLED: "1"
        SESSION_SECRET: !Ref SessionSecret
        LIBRARIAN_AGENT_ENABLED: "1"
        BEDROCK_AGENT_MODEL: us.anthropic.claude-sonnet-4-6
        BEDROCK_EMBEDDING_MODEL: cohere.embed-english-v3
        BEDROCK_RERANK_MODEL: cohere.rerank-v3-5:0
        BEDROCK_RERANK_REGION: us-west-2

Resources:
  LibrarianHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
        AllowMethods:
          - OPTIONS
          - POST
        AllowHeaders:
          - content-type
          - authorization

  LibrarianTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  LibrarianFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../librarian_api/
      Handler: app.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LibrarianTable
        - S3ReadPolicy:
            BucketName: !Ref CorpusBucket
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-sonnet-4-6
                - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-sonnet-4-6
                - arn:aws:bedrock:us-east-2::foundation-model/anthropic.claude-sonnet-4-6
                - arn:aws:bedrock:us-west-2::foundation-model/anthropic.claude-sonnet-4-6
                - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/cohere.embed-english-v3
                - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/cohere.rerank-v3-5:0
                - arn:aws:bedrock:us-west-2::foundation-model/cohere.rerank-v3-5:0
                - arn:aws:bedrock:ca-central-1::foundation-model/cohere.rerank-v3-5:0
                - arn:aws:bedrock:eu-central-1::foundation-model/cohere.rerank-v3-5:0
                - arn:aws:bedrock:ap-northeast-1::foundation-model/cohere.rerank-v3-5:0
            - Effect: Allow
              Action: bedrock:Rerank
              Resource: "*"
      Events:
        Auth:
          Type: HttpApi
          Properties:
            ApiId: !Ref LibrarianHttpApi
            Path: /auth
            Method: POST
        Chat:
          Type: HttpApi
          Properties:
            ApiId: !Ref LibrarianHttpApi
            Path: /chat
            Method: POST
        Prompts:
          Type: HttpApi
          Properties:
            ApiId: !Ref LibrarianHttpApi
            Path: /prompts
            Method: POST

Outputs:
  LibrarianApiUrl:
    Description: Base URL for the Archive Librarian API.
    Value: !Sub "https://${LibrarianHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
