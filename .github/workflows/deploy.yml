name: Build and Deploy

# Render surface. WT Builder (wt-builder) owns publishing and commits the
# generated issue pages into this repo (apps/site/archive/*.md);
# librarian-thing pushes data/librarian/graph.json on corpus rebuilds.
# Weekly refreshes its own landing-page stats (subscriber/supporter numbers)
# here, then builds with 11ty + Pagefind and deploys to Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Validate documentation links
        run: npm run test:docs

      # Advisory, not a gate: an upstream advisory landing overnight blocked
      # publishing twice (2026-06-12, and ~44h on 2026-08-05). The step still
      # runs so the log shows any high-severity findings for maintenance.
      - name: Audit dependencies
        continue-on-error: true
        run: npm audit --audit-level=high

      # weekly owns its landing-page stats (subscriber + supporter numbers).
      # Best-effort: a Buttondown/Stripe hiccup falls back to the committed
      # stats.json, so it never blocks the deploy.
      - name: Refresh stats
        continue-on-error: true
        run: npm run refresh-stats
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}

      - name: Build site
        run: npm run build

      - name: Build search index
        run: npm run build:search

      - name: Install browser test dependencies
        run: npx playwright install --with-deps chromium

      # Real gate: serves the built _site (with its Pagefind index) exactly as
      # it will deploy. A failure stops the deploy.
      - name: Run browser tests
        run: npm run test:e2e

      - name: Upload browser test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
