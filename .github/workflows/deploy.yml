name: Build and Deploy

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [new_issue]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 0'  # Every Sunday at 6am UTC (midnight CST)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: pip install -r requirements.txt

      - run: npm ci

      # Full rebuild: workflow_dispatch (manual) and schedule (weekly cron)
      - name: Full data rebuild
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: python scripts/build_data.py --no-cache
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}

      # New issue: repository_dispatch from Buttondown webhook
      - name: Fetch latest issue
        if: github.event_name == 'repository_dispatch'
        run: python scripts/fetch_latest.py
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}

      # push: no data pipeline, build from committed files

      - name: Build site
        run: npx @11ty/eleventy

      - name: Build search index
        run: npx pagefind --site _site --glob "**/*.html"

      - name: Commit new issues
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/archive/ src/_data/emails.json src/_data/stats.json
          git diff --staged --quiet || (git commit -m "Add new newsletter issue(s)" && git push)

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
