name: Build and Deploy

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [new_issue]
  workflow_dispatch:
    inputs:
      content_update:
        description: "Content pipeline to run before deploying"
        required: true
        default: "none"
        type: choice
        options:
          - none
          - latest
          - latest-force
          - full
  schedule:
    # Weekend morning polling window for new issues.
    # Covers roughly 6am-10am America/Chicago across CST/CDT.
    - cron: '0 11-16 * * 6,0'

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      should_deploy: ${{ steps.deploy-check.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - run: pip install -r requirements.txt

      - run: npm ci

      # Full rebuild only when explicitly requested.
      - name: Full data rebuild
        if: github.event_name == 'workflow_dispatch' && inputs.content_update == 'full'
        run: python pipeline/content/content.py pull --all
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}

      # New issue: repository_dispatch from an authenticated relay, or manual latest update.
      - name: Fetch latest issue and update if present
        if: github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.content_update == 'latest-force')
        run: python pipeline/content/content.py pull --latest
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}

      # Scheduled/manual polling should be cheap and no-op when the latest issue is already committed.
      - name: Poll latest issue
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.content_update == 'latest')
        run: python pipeline/content/content.py pull --latest --skip-existing
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}

      # push: no data pipeline, build from committed files
      # workflow_dispatch with content_update=none: no data pipeline, build from committed files

      # Render and upload audio for the latest issue. Idempotent: skips when
      # the manifest's audio_script_hash already matches and the S3 object
      # exists. continue-on-error so a transient OpenAI/AWS hiccup doesn't
      # block the site deploy — audio can be retried by re-dispatching.
      - name: Install ffmpeg
        if: github.event_name != 'push'
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Render and upload audio for latest issue
        if: github.event_name != 'push'
        continue-on-error: true
        run: python pipeline/audio/audio.py build --latest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1

      # Defensive resync: regenerate archive from the data/buttondown/ snapshots
      # plus data/audio/manifest.json. audio.py runs this internally on success;
      # this guarantees archive is current even if audio.py partially failed.
      - name: Rebuild archive from manifests
        if: github.event_name != 'push'
        run: python pipeline/content/content.py build

      - name: Build librarian corpus
        if: github.event_name != 'push'
        run: python pipeline/librarian/build_librarian_corpus.py

      # Embed corpus + graph and push to S3 so Thingy answers cite the new
      # issue. Costs ~$0.20–$0.30 in Cohere embeddings per refresh.
      # continue-on-error so a Bedrock hiccup doesn't block the site deploy.
      - name: Upload embedded corpus + graph to S3
        if: github.event_name != 'push'
        continue-on-error: true
        run: python pipeline/librarian/upload_librarian_corpus.py
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          LIBRARIAN_BUCKET: weekly-thing-librarian

      - name: Decide whether to build and deploy
        id: deploy-check
        run: |
          if [[ "${{ github.event_name }}" == "schedule" || ( "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.content_update }}" == "latest" ) ]]; then
            if git diff --quiet -- data/buttondown/ data/librarian/ data/links/ data/audio/ site/archive/ site/_data/emails.json site/_data/stats.json; then
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
              echo "No content changes found; skipping build and deploy."
            else
              echo "should_deploy=true" >> "$GITHUB_OUTPUT"
              echo "Content changes found; building and deploying."
            fi
          else
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "Build and deploy required for this event."
          fi

      - name: Build site
        if: steps.deploy-check.outputs.should_deploy == 'true'
        run: npm run build

      - name: Build search index
        if: steps.deploy-check.outputs.should_deploy == 'true'
        run: npm run build:search

      - name: Commit new issues
        if: github.event_name != 'push' && steps.deploy-check.outputs.should_deploy == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/buttondown/ data/librarian/ data/links/ data/audio/ site/archive/ site/_data/emails.json site/_data/stats.json
          git diff --staged --quiet || (git commit -m "Add new newsletter issue(s)" && git push)

      - uses: actions/upload-pages-artifact@v5
        if: steps.deploy-check.outputs.should_deploy == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
