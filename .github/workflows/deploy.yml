name: Build and Deploy

# Render surface. WT Builder (wt-builder) owns publishing and commits the
# generated issue pages into this repo (apps/site/archive/*.md);
# librarian-thing pushes data/librarian/graph.json on corpus rebuilds.
# Weekly refreshes its own landing-page stats (subscriber/supporter numbers)
# here, then builds with 11ty + Pagefind and publishes to S3 behind CloudFront
# (infra/, scripts/deploy-aws.mjs). GitHub Pages served the site until the
# DNS moved to CloudFront on 2026-10-26.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Reader-facing dates are Chicago days computed in code; building in UTC
    # means the runner's zone can never hide a date that slices UTC.
    env:
      TZ: UTC
    steps:
      # Full history: the sitemap dates each issue by its last commit
      # (apps/site/_data/issueEdited.js), and a shallow clone would date them
      # all today.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Validate documentation links
        run: npm run test:docs

      - name: Unit tests
        run: npm run test:unit

      # Advisory, not a gate: an upstream advisory landing overnight blocked
      # publishing twice (2026-06-12, and ~44h on 2026-08-05). The step still
      # runs so the log shows any high-severity findings for maintenance.
      - name: Audit dependencies
        continue-on-error: true
        run: npm audit --audit-level=high

      # weekly owns its landing-page stats (subscriber + supporter numbers).
      # Best-effort: a Buttondown/Stripe hiccup falls back to the committed
      # stats.json, so it never blocks the deploy.
      - name: Refresh stats
        continue-on-error: true
        run: npm run refresh-stats
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}

      - name: Build site
        run: npm run build

      - name: Build search index
        run: npm run build:search

      - name: Install browser test dependencies
        run: npx playwright install --with-deps chromium

      # Real gate: serves the built _site (with its Pagefind index) exactly as
      # it will deploy. A failure stops the deploy.
      - name: Run browser tests
        run: npm run test:e2e

      - name: Upload browser test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: _site
          retention-days: 7

  # Publishes the tested build: the files that changed, the redirect map into CloudFront's key
  # value store, the cache cleared, then the result read back through the distribution.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - uses: actions/download-artifact@v7
        with:
          name: site
          path: _site

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Publish to S3 and CloudFront
        run: npm run deploy:aws
