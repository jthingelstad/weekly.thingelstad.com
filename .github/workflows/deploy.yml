name: Build and Deploy

# Render surface. Studio (studio-thing) owns production and commits the
# generated 11ty inputs into this repo (apps/site/archive/*.md,
# apps/site/_data/{emails,status}.json, data/librarian/graph.json).
# Weekly refreshes its own landing-page stats (subscriber/supporter numbers)
# here, then builds with 11ty + Pagefind and deploys to Pages.
# See studio-thing/PHASE_2.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      # weekly owns its landing-page stats (subscriber + supporter numbers).
      # Best-effort: a Buttondown/Stripe hiccup falls back to the committed
      # stats.json, so it never blocks the deploy.
      - name: Refresh stats
        continue-on-error: true
        run: npm run refresh-stats
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}

      - name: Build site
        run: npm run build

      - name: Build search index
        run: npm run build:search

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
